version: 1
generated_from: local/20260616/lts-maintenance-plan.md
maintenance_model: protected-selective-port-with-minimal-shared-file-delta

status_definitions:
  protected: LTS identity surface. Must remain present and functional unless the LTS product direction changes.
  lts-maintained: Upstream-deprecated or downstream-only, but still supported by CPA-Core-LTS.
  coexist: Accepted upstream feature. May coexist with LTS surfaces, but must not replace protected behavior.
  shared: Shared Core/Panel management behavior that can evolve with compatible contracts.
  experimental: Optional surface that may be gated or hidden when backend support is missing.

