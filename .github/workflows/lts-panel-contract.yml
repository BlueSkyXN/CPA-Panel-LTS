name: LTS Panel Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lts-panel-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test usage compatibility semantics
        run: npm run test:usage

      - name: Test provider and connection contracts
        run: npm run test:providers && npm run test:auth-files && npm run test:api-client

      - name: Test logs incremental merge semantics
        run: npm run test:logs

      - name: Check LTS panel contract
        run: npm run check:lts

      - name: Type-check
        run: npm run type-check

      - name: Build single-file panel
        run: npm run build

      - name: Lint
        run: npm run lint
