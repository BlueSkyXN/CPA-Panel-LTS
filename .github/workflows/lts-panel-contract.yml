name: LTS Panel Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lts-panel-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test usage compatibility semantics
        run: npm run test:usage

      - name: Check LTS panel contract
        run: npm run check:lts

      - name: Type-check
        run: npm run type-check

      - name: Build single-file panel
        run: npm run build

      - name: Lint
        run: npm run lint
