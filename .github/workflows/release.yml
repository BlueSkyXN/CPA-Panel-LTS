name: Build and Release

on:
  push:
    tags:
      - 'v*-lts-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build and publish, for example v1-lts-0.0.1'
        required: true
        type: string
      rewrite_release_notes:
        description: 'Replace the title and notes when the Release already exists'
        required: false
        default: false
        type: boolean

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
  REWRITE_RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.rewrite_release_notes || false }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout current release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: _release_tools
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release source
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" != v*-lts-* ]]; then
            echo "Only Panel LTS release tags matching v*-lts-* are supported." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "Release source mismatch: HEAD=${head_commit}, ${RELEASE_TAG}=${tag_commit}." >&2
            exit 1
          fi
          echo "Verified ${RELEASE_TAG} at ${tag_commit}."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all-in-one HTML
        run: npm run build
        env:
          VERSION: ${{ env.RELEASE_TAG }}

      - name: Prepare release assets
        run: |
          cd dist
          mv index.html management.html
          ls -lh management.html

      - name: Generate release notes
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" != v*-lts-* ]]; then
            echo "Only panel release tags matching v*-lts-* are supported."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Release tag ${RELEASE_TAG} does not exist."
            exit 1
          fi

          release_exists=false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_exists=true
          fi
          echo "RELEASE_EXISTS=${release_exists}" >> "$GITHUB_ENV"
          if [[ "$release_exists" == "true" && "$REWRITE_RELEASE_NOTES" != "true" ]]; then
            echo "Release ${RELEASE_TAG} already exists; preserving its title and notes."
            echo "RELEASE_NOTES_READY=false" >> "$GITHUB_ENV"
            exit 0
          fi

          bash _release_tools/scripts/generate-lts-release-notes.sh \
            --tag "${RELEASE_TAG}" \
            --notes-file "$GITHUB_WORKSPACE/release-notes.md" \
            --title-file "$GITHUB_WORKSPACE/release-title.txt"
          echo "RELEASE_TITLE=$(tr -d '\n' < release-title.txt)" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_READY=true" >> "$GITHUB_ENV"

      - name: Publish release and management.html
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            if [[ "$RELEASE_NOTES_READY" == "true" ]]; then
              gh release edit "$RELEASE_TAG" \
                --title "$RELEASE_TITLE" \
                --notes-file release-notes.md
            fi
            gh release upload "$RELEASE_TAG" dist/management.html --clobber
          else
            if [[ "$RELEASE_NOTES_READY" != "true" ]]; then
              echo "Release notes are required when creating ${RELEASE_TAG}." >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" dist/management.html \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi

          published_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if [[ "$published_assets" != "management.html" ]]; then
            echo "Published release assets must contain only management.html; got:" >&2
            printf '%s\n' "$published_assets" >&2
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
