name: Build and Release

on:
  push:
    tags:
      - 'v*-tls-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build and publish, for example v1-tls-0.0.1'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all-in-one HTML
        run: npm run build
        env:
          VERSION: ${{ github.event.inputs.release_tag || github.ref_name }}

      - name: Prepare release assets
        run: |
          cd dist
          mv index.html management.html
          ls -lh management.html

      - name: Generate release notes
        run: |
          set -euo pipefail
          current_tag="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          if [[ "${current_tag}" != v*-tls-* ]]; then
            echo "Only panel release tags matching v*-tls-* are supported."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${current_tag}" >/dev/null; then
            echo "Release tag ${current_tag} does not exist."
            exit 1
          fi

          previous_tag="$(git tag --merged HEAD --list 'v*-tls-*' --sort=-v:refname | grep -v "^${current_tag}$" | head -n 1 || true)"
          if [ -z "${previous_tag}" ]; then
            previous_tag="$(git tag --merged HEAD --list 'v*-lts.*' --sort=-v:refname | head -n 1 || true)"
          fi
          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${current_tag}"
          elif git rev-parse -q --verify "refs/tags/v1.8.4" >/dev/null; then
            range="v1.8.4..${current_tag}"
          else
            range="${current_tag}"
          fi

          : > release-notes.md
          git log --pretty=format:"- %h %s" "${range}" >> release-notes.md
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/management.html
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
