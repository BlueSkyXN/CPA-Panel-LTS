name: Build and Release

on:
  push:
    tags:
      - 'v*-tls-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build and publish, for example v1-tls-0.0.1'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all-in-one HTML
        run: npm run build
        env:
          VERSION: ${{ github.event.inputs.release_tag || github.ref_name }}

      - name: Prepare release assets
        run: |
          cd dist
          mv index.html management.html
          ls -lh management.html

      - name: Generate release notes
        run: |
          set -euo pipefail
          current_tag="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          if [[ "${current_tag}" != v*-tls-* ]]; then
            echo "Only panel release tags matching v*-tls-* are supported."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${current_tag}" >/dev/null; then
            echo "Release tag ${current_tag} does not exist."
            exit 1
          fi

          bash scripts/generate-lts-release-notes.sh \
            --product panel \
            --tag "${current_tag}" \
            --notes-file release-notes.md \
            --title-file release-title.txt
          echo "RELEASE_TITLE=$(tr -d '\n' < release-title.txt)" >> "$GITHUB_ENV"
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ env.RELEASE_TITLE }}
          files: |
            dist/management.html
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
